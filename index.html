<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>traDex</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <main class="container">

    <header class="app-header">
      <h1>traDex</h1>

      <p class="subtitle">
        TCG Identification & Price Comparison
      </p>

      <p class="tagline">
        Scan. Identify. Compare. Trade.
      </p>
    </header>

    <section class="actions">
  <button id="scanButton" type="button">
    📷 Scan Card
  </button>

  <button id="searchButton" type="button">
    🔍 Search Card
  </button>
</section>

<section id="searchPanel" class="search-panel hidden">
  <form id="searchForm">
    <label for="searchInput">Search by card name or number</label>

    <div class="search-row">
      <input
        id="searchInput"
        type="search"
        placeholder="Example: Charizard 199"
        autocomplete="off"
        required
      >

      <button id="submitSearchButton" type="submit">
        Search
      </button>
    </div>
  </form>

  <p id="searchStatus"></p>

  <div id="searchResults" class="search-results"></div>
</section>

    <section class="recent">
      <h2>Recent Cards</h2>
      <p>Nothing yet...</p>
    </section>

    <footer>
      Version 0.1
    </footer>

  </main>

  <script src="app.js"></script>

</body>
</html>
