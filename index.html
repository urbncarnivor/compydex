<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CompyDex</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <main class="container">

    <header class="app-header">
    <h1>CompyDex</h1>

    <p class="subtitle">
        Know the Value. Make the Deal.
    </p>

    <p class="tagline">
        Scan. Compare. Price. Trade.
    </p>
</header>

    <section class="actions">
  <button id="scanButton" type="button">
    📷 Scan Card
  </button>

</section>

<section id="searchPanel" class="search-panel">
  <form id="searchForm" onsubmit="return false;">
    <label for="searchInput">Search by card name or number</label>

    <div class="search-row">
      <input
        id="searchInput"
        type="search"
        placeholder="Example: Charizard V 154"
        autocomplete="off"
        required
      >

      <button id="submitSearchButton" type="submit">
        Search
      </button>
    </div>
  </form>

  <p id="searchStatus"></p>

  <div id="searchResults" class="search-results"></div>
</section>
<section id="cardDetailPanel" class="card-detail-panel hidden">

  <button id="closeDetailButton" class="close-detail-button" type="button">
    ✕ Close
  </button>

  <div class="selected-card-header">
    <img id="selectedCardImage" src="" alt="Selected card">

    <div>
      <h2 id="selectedCardName">Card Name</h2>
      <p id="selectedCardSet">Set Name</p>
      <p id="selectedCardNumber">Card Number</p>
      <p id="selectedCardRarity">Rarity</p>
    </div>
  </div>

  <div class="detail-field">
    <label for="conditionSelect">Condition</label>

    <select id="conditionSelect">
      <option value="1">Near Mint (NM)</option>
      <option value="0.9">Lightly Played (LP)</option>
      <option value="0.8">Moderately Played (MP)</option>
      <option value="0.6">Heavily Played (HP)</option>
      <option value="0.4">Damaged (DMG)</option>
    </select>
  </div>

  <div class="price-grid">
    <div class="price-box">
      <span>TCG Market</span>
      <strong id="marketPrice">$0.00</strong>
    </div>

    <div class="price-box">
      <span>Condition Value</span>
      <strong id="conditionPrice">$0.00</strong>
    </div>
  </div>

<button id="ebaySoldButton" type="button">
    View eBay Sold Listings
</button>

  <div class="detail-field">
    <label for="finalCompInput">Final Comp</label>

    <div class="money-input">
      <span>$</span>
      <input
        id="finalCompInput"
        type="number"
        min="0"
        step="0.01"
        value="0.00"
      >
    </div>
  </div>

  <div class="detail-field">
    <label for="percentageInput">Offer Percentage</label>

    <div class="percentage-input">
      <input
        id="percentageInput"
        type="number"
        min="0"
        max="100"
        step="1"
        value="70"
      >
      <span>%</span>
    </div>
  </div>

  <div class="quick-percentages">
    <button type="button" data-percentage="60">60%</button>
    <button type="button" data-percentage="70">70%</button>
    <button type="button" data-percentage="75">75%</button>
    <button type="button" data-percentage="80">80%</button>
    <button type="button" data-percentage="90">90%</button>
  </div>

  <div class="offer-result">
    <span>Offer Amount</span>
    <strong id="offerAmount">$0.00</strong>
  </div>

</section>
    <section class="recent">
      <h2>Recent Cards</h2>
      <div id="recentCards">
      <p>Nothing yet...</p>
      </div>
    </section>

    <footer>
      Version 0.1
    </footer>

  </main>

  <script src="app.js"></script>

</body>
</html>
