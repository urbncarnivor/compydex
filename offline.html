<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>CompyDex — Offline</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0b1220; color: #f8fafc; }
    main { width: min(100%, 440px); padding: 28px; border: 1px solid #334155; border-radius: 18px; background: #111827; box-shadow: 0 18px 50px rgb(0 0 0 / 35%); }
    h1 { margin: 0 0 8px; color: #facc15; }
    p { line-height: 1.55; color: #cbd5e1; }
    button { width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 12px; background: #facc15; color: #111827; font: inherit; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <h1>CompyDex</h1>
    <p>You’re offline and the main app has not finished saving to this device yet.</p>
    <p>Reconnect once, open CompyDex, and it will be ready for future offline access.</p>
    <button type="button" onclick="location.reload()">Try Again</button>
  </main>
</body>
</html>
